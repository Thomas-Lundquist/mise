<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mise en Place Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="storage-warning" class="banner banner-warning" hidden role="status">
  Your browser is blocking on-page storage, so your work won't survive a refresh.
  <a id="storage-warning-link" href="#" target="_blank" rel="noopener">Open this page in a new tab</a> to be safe.
</div>

<header class="identity-strip">
  <div class="identity-strip__row">
    <div class="field">
      <label for="meta-name">Name</label>
      <input type="text" id="meta-name" autocomplete="off">
    </div>
    <div class="field field--narrow">
      <label for="meta-kitchen">Kitchen #</label>
      <input type="text" id="meta-kitchen" autocomplete="off">
    </div>
    <div class="field field--narrow">
      <label for="meta-date">Date</label>
      <input type="date" id="meta-date">
    </div>
    <div class="field field--narrow">
      <label for="meta-role">Today's role</label>
      <input type="text" id="meta-role" autocomplete="off">
    </div>
    <div class="field field--wide">
      <label for="meta-recipe">Recipe</label>
      <input type="text" id="meta-recipe" autocomplete="off">
    </div>
  </div>
  <div class="identity-strip__row identity-strip__row--controls no-print">
    <span id="timer" class="timer" hidden></span>
    <button type="button" id="print-btn" class="btn btn--secondary">Print / Save PDF</button>
  </div>
</header>

<main>

  <section class="card" id="section-read" aria-labelledby="section-read-heading">
    <h2 id="section-read-heading"><span class="section-num">01</span> Read</h2>
    <label class="checkbox-row">
      <input type="checkbox" id="read-done">
      I read the entire recipe, start to finish.
    </label>
    <div class="field">
      <label for="read-hardest">The step I think will be hardest today:</label>
      <input type="text" id="read-hardest" autocomplete="off">
    </div>
  </section>

  <section class="card" id="section-pull" aria-labelledby="section-pull-heading">
    <h2 id="section-pull-heading"><span class="section-num">02</span> Pull</h2>

    <div class="field no-print">
      <label for="equipment-search">Search equipment</label>
      <input type="text" id="equipment-search" placeholder="Type to filter…" autocomplete="off">
    </div>

    <div id="equipment-palette" class="palette no-print" aria-label="Equipment palette"></div>

    <div class="field no-print">
      <label for="equipment-custom">Not on the list?</label>
      <div class="inline-add">
        <input type="text" id="equipment-custom" placeholder="Add your own…" autocomplete="off">
        <button type="button" id="equipment-custom-add" class="btn btn--small">Add</button>
      </div>
    </div>

    <div class="tray">
      <h3>Pulled</h3>
      <ul id="equipment-tray" class="tray__list" aria-live="polite"></ul>
    </div>
  </section>

  <section class="card" id="section-group" aria-labelledby="section-group-heading">
    <h2 id="section-group-heading"><span class="section-num">03</span> Group</h2>
    <div id="bowl-grid" class="bowl-grid"></div>
    <button type="button" id="bowl-add" class="btn btn--small no-print">+ Add bowl</button>
  </section>

  <section class="card" id="section-time" aria-labelledby="section-time-heading">
    <h2 id="section-time-heading"><span class="section-num">04</span> Time</h2>
    <div id="time-planner"></div>
  </section>

</main>

<footer class="no-print">
  <p class="helper-text">
    When you're done, print to PDF and upload it to the Canvas assignment.
    Suggested filename: <code>LastName-Recipe-Mise.pdf</code>
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
